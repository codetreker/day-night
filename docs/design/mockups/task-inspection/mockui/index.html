<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务卡片交互 · 附件原型</title><style>
:root{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172132;background:#f7f8fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:26px}h1{font-size:18px;line-height:1.5;letter-spacing:-.3px;margin:0 0 6px}p{font-size:11px;color:#737d8e;margin:0 0 25px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8c8cf0;outline-offset:3px}.canvas{border:1px solid #e5e8ee;background-color:#fafbfe;background-image:radial-gradient(#d9dee9 .75px,transparent .75px);background-size:18px 18px;border-radius:9px;padding:40px 22px;display:flex;align-items:center;justify-content:center;gap:30px;min-height:220px;overflow:auto}.card{flex:none;position:relative;width:220px;height:136px;background:#fff;border:1px solid #dce1ea;border-left:3px solid #287454;border-radius:7px;box-shadow:0 3px 7px #27386206}.card.active{outline:2px solid #7272de;outline-offset:3px}.card.upstream{border-color:#b5b5e9;border-left-color:#287454;background:#f9f9ff}.select{display:flex;flex-direction:column;width:100%;height:94px;border:0;background:transparent;text-align:left;padding:8px 11px}.id{font-size:8px;line-height:11px;color:#7e899c;margin-bottom:3px}.title{font-size:12px;font-weight:600;line-height:16px}.status{font-size:9px;color:#287454;margin-top:auto;display:flex;align-items:center;gap:5px}.status i{width:6px;height:6px;background:currentColor;border-radius:50%}.card.todo{border-left-color:#727e90}.todo .status{color:#727e90}.details{position:absolute;bottom:47px;right:9px;border:0;background:none;color:#6060b1;font-size:9px;padding:1px 2px;text-decoration:underline;text-underline-offset:2px}.empty-expansion{height:40px;border-top:1px solid #edf0f4;background:#fcfcfe;display:grid;grid-template-columns:1fr 1fr}.empty-expansion:after{content:"";border-left:1px solid #edf0f4}.line{width:30px;height:2px;background:#b9c1d1;position:relative;flex:none;margin-left:-30px;margin-right:-30px}.line:after{content:"";position:absolute;right:0;top:-3px;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid #b9c1d1}.line.active{background:#7777dc}.line.active:after{border-left-color:#7777dc}.footer{font-size:10px;color:#737d8e;margin-top:15px}.mini-overlay{position:fixed;inset:0;background:#19233566;display:flex;align-items:center;justify-content:center;padding:18px}.mini-dialog{width:430px;max-width:100%;background:#fff;border:1px solid #e1e5ed;border-radius:10px;box-shadow:0 16px 50px #17244733;padding:24px;position:relative}.mini-dialog h2{font-size:18px;margin:0 0 13px}.mini-dialog p{margin:0;color:#45516a;font-size:12px;line-height:1.85}.mini-dialog button{border:1px solid #dce0e8;border-radius:6px;padding:7px 11px;font-size:11px;background:#fff;margin-top:20px}.hint{margin-top:12px;font-size:10px;color:#737d8e}[hidden]{display:none!important}@media(max-width:500px){body{padding:20px 15px}.canvas{justify-content:flex-start}.canvas .card{width:220px}.canvas{padding:30px 20px;gap:30px}.footer{line-height:1.8}}
</style></head>
<body><h1>独立的选择与详情入口</h1><p>附件中的交互样例 · 点击第二张卡片查看依赖高亮。</p><div class="canvas" id="canvas"><article class="card" id="first"><button class="select" type="button" data-select="first" aria-pressed="false"><span class="id">019b · 010</span><span class="title">建立任务浏览基础</span><span class="status"><i></i>已完成</span></button><button class="details" type="button" data-detail="first">详情</button><div class="empty-expansion" aria-hidden="true"></div></article><div class="line" id="line"></div><article class="card todo" id="second"><button class="select" type="button" data-select="second" aria-pressed="false"><span class="id">019b · 012</span><span class="title">点击卡片高亮全部依赖</span><span class="status"><i></i>待处理</span></button><button class="details" type="button" data-detail="second">详情</button><div class="empty-expansion" aria-hidden="true"></div></article></div><div class="footer" id="status" role="status">未选择任务</div><div class="hint">横向滚动查看完整示例。Esc 关闭任务详情。</div><div class="mini-overlay" id="overlay" hidden><section class="mini-dialog" role="dialog" aria-modal="true" aria-labelledby="heading"><h2 id="heading"></h2><p>卡片主体控制依赖高亮，详情入口打开居中浮层。关闭后保留画布上的选择状态。</p><button id="close" type="button">关闭详情</button></section></div><script>
const $=(id)=>document.getElementById(id);let selected=null,trigger=null;const titles={first:'建立任务浏览基础',second:'点击卡片高亮全部依赖'};const close=()=>{$('overlay').hidden=true;trigger?.focus();};document.addEventListener('click',(event)=>{const select=event.target.closest('[data-select]'),detail=event.target.closest('[data-detail]');if(select){selected=selected===select.dataset.select?null:select.dataset.select;for(const id of ['first','second']){$(id).classList.toggle('active',selected===id);$(id).querySelector('.select').setAttribute('aria-pressed',String(selected===id));}$('first').classList.toggle('upstream',selected==='second');$('line').classList.toggle('active',selected==='second');$('status').textContent=selected===null?'未选择任务':selected==='second'?'已选中「点击卡片高亮全部依赖」· 1 个上游':'已选中「建立任务浏览基础」· 无上游';}if(detail){trigger=detail;$('heading').textContent=titles[detail.dataset.detail];$('overlay').hidden=false;$('close').focus();}});$('close').onclick=close;$('overlay').onclick=(event)=>{if(event.target===$('overlay'))close();};document.addEventListener('keydown',(event)=>{if(event.key==='Escape'){event.preventDefault();if(!$('overlay').hidden)close();else parent.postMessage({type:'task-inspection-close-preview'},'*');}if(event.key==='Tab'){if(!$('overlay').hidden){event.preventDefault();$('close').focus();}else{const items=[...document.querySelectorAll('button')].filter((button)=>!button.closest('[hidden]')),active=document.activeElement;if((event.shiftKey&&active===items[0])||(!event.shiftKey&&active===items.at(-1))){event.preventDefault();parent.postMessage({type:'task-inspection-frame-tab',backwards:event.shiftKey},'*');}}}});
</script></body></html>
