<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目协作成果</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <p class="eyebrow">项目协作 · 设计成果</p>
    <h1>连接团队，推进工作。</h1>
    <p class="description">邀请协作者加入项目，把任务、依赖和共享成果放在一起。</p>
    <div class="metrics"><div><strong>3</strong><span>协作成员</span></div><div><strong>48</strong><span>项目任务</span></div><div><strong id="completed">—</strong><span>已完成</span></div></div>
    <button id="update" type="button">查看交付进度</button>
    <p id="result" role="status">正在读取项目成果…</p>
    <a href="#details" id="details-link">查看协作说明 ↓</a>
    <section id="details"><h2>清晰的协作边界</h2><p>成员共同读写任务和附件，管理员维护团队成员关系。</p></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
