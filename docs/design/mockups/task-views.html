.task-detail-backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #19233566;
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.task-detail-dialog {
  width: 960px;
  max-width: 100%;
  max-height: min(880px, calc(100dvh - 48px));
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #e1e5ed;
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 24px 90px #17244733;
  animation: task-detail-appear .2s ease-out;
}

.task-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 16px 26px;
  color: #737d8e;
  gap: 15px;
  flex: none;
}
.task-detail-header h2 { font-size: 12px; font-weight: 500; margin: 0; }
.task-detail-close { height: 32px; width: 32px; padding: 0; flex: none; }
.task-detail-body { overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.task-detail-heading { padding: 24px 30px 0; }
.task-detail-id { font-size: 10px; color: #737d8e; margin-bottom: 8px; overflow-wrap: anywhere; }
.task-detail-title { font-size: 25px; line-height: 1.45; font-weight: 650; letter-spacing: -.4px; margin: 0 0 13px; overflow-wrap: anywhere; }
.task-detail-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task-detail-status, .task-detail-ready, .task-detail-blocked { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; font-size: 10px; font-weight: 500; padding: 4px 8px; }
.task-detail-status-proposed { background: #f1ebf8; color: #8262a5; }
.task-detail-status-todo { background: #edf0f4; color: #667387; }
.task-detail-status-in_progress { background: #edf2ff; color: #4e74bd; }
.task-detail-status-done { background: #eaf5ef; color: #438365; }
.task-detail-ready { background: #eeeeff; color: #6060b1; }
.task-detail-blocked { background: #fff4e5; color: #946b34; }

.task-detail-columns { display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 30px; padding: 25px 30px 30px; }
.task-detail-main, .task-detail-aside { min-width: 0; }
.task-detail-section { border-top: 1px solid #edf0f4; padding-top: 18px; margin: 21px 0 0; }
.task-detail-section:first-child { margin-top: 0; }
.task-detail-section h4 { font-size: 11px; color: #737d8e; font-weight: 550; margin: 0 0 11px; letter-spacing: .3px; }
.task-detail-description { white-space: pre-wrap; color: #637087; font-size: 12px; line-height: 1.9; overflow-wrap: anywhere; }
.task-detail-relations { list-style: none; margin: 0; padding: 0; }
.task-detail-relation { width: 100%; display: flex; gap: 8px; align-items: center; border: 1px solid #e9ecf2; background: #fff; border-radius: 6px; padding: 10px; text-align: left; margin: 7px 0; font-size: 11px; }
.task-detail-relation:hover { background: #f7f7fd; }
.task-detail-relation span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task-detail-relation-arrow { color: #747ca1; flex: none; }
.task-detail-relation-dot { width: 6px; height: 6px; background: #8f9bad; border-radius: 50%; flex: none; }
.task-detail-dot-done { background: #5d9b7e; }
.task-detail-dot-in_progress { background: #6b8bcb; }
.task-detail-dot-proposed { background: #9979ba; }
.task-detail-dot-todo { background: #97a2b2; }
.task-detail-metadata { font-size: 10px; line-height: 1.8; color: #737d8e; }
.task-detail-metadata > div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; }
.task-detail-metadata dt { flex: none; }
.task-detail-metadata dd { font-weight: 400; color: #68758b; text-align: right; margin: 0; min-width: 0; }
.task-detail-full-id { overflow-wrap: anywhere; }
.task-detail-footer { border-top: 1px solid var(--line); padding: 12px 26px; color: #737d8e; font-size: 10px; flex: none; line-height: 1.7; }
.task-detail-state { min-height: 350px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 13px; color: #637087; font-size: 12px; overflow-wrap: anywhere; }
.task-detail-state h3 { color: #45516a; font-size: 16px; margin: 0; }
.task-detail-stale { border: 1px solid #e7d7c2; background: #fffaf1; border-radius: 7px; padding: 13px; margin-top: 20px; color: #79623d; font-size: 11px; line-height: 1.8; }
.task-detail-stale .button { margin-top: 9px; font-size: 11px; }

.task-detail-pr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.task-detail-pr { border: 1px solid #e9ecf2; border-radius: 6px; padding: 12px 13px; min-width: 0; }
.task-detail-pr-title { font-size: 12px; font-weight: 550; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 21px; color: #344258; margin: 0 0 6px; }
.task-detail-pr-empty { color: #737d8e; font-weight: 400; font-style: italic; }
.task-detail-pr-url { font-size: 10px; line-height: 1.8; display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.task-detail-pr-label { font-size: 9px; color: #737d8e; flex: none; }
.task-detail-pr-value { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; color: #637087; }
.task-detail-pr-value[href] { color: #5c5cbd; text-decoration: underline; text-underline-offset: 3px; }
.task-detail-pr-value[href]:hover { color: #44449b; }
.task-detail-pr-external { font-size: 10px; flex: none; color: #747ca1; margin-left: auto; }
.task-detail-pr-pagination { margin: 0 0 13px; }
.task-detail-pr-range { font-size: 10px; color: #737d8e; line-height: 1.8; margin: 0 0 8px; }
.task-detail-pr-page-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-detail-pr-page-controls .button { font-size: 10px; padding: 6px 9px; }
.task-detail-pr-page-label { font-size: 10px; color: #737d8e; }
.task-detail-pr-page-select { font: inherit; font-size: 10px; min-width: 0; max-width: 110px; flex: 1; border: 1px solid #dce0e8; border-radius: 5px; padding: 6px; color: #344258; background: #fff; }
.task-detail-pr-page-select:focus-visible, .task-detail-section h4:focus-visible { outline: 3px solid #8c8cf0; outline-offset: 3px; }

@keyframes task-detail-appear {
  from { transform: translateY(8px) scale(.985); opacity: .5; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

@media (max-width: 850px) {
  .task-detail-columns { grid-template-columns: minmax(0, 1fr) 225px; gap: 23px; }
}

@media (max-width: 600px) {
  .task-detail-backdrop { padding: 12px; }
  .task-detail-dialog { max-height: min(880px, calc(100dvh - 24px)); border-radius: 10px; }
  .task-detail-header { padding: 12px 17px; }
  .task-detail-close { min-width: 36px; min-height: 36px; }
  .task-detail-heading { padding: 22px 19px 0; }
  .task-detail-title { font-size: 21px; }
  .task-detail-columns { display: block; padding: 20px 19px 24px; }
  .task-detail-aside { margin-top: 24px; }
  .task-detail-footer { padding: 11px 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .task-detail-dialog { animation: none; }
}

const icons={chevron:'<svg class="root-chevron" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'};
const tasks=[
{id:'proposed-plan',title:'确定下一阶段的项目任务方案',status:'proposed',date:'10 月 22 日 14:40',kind:'chain',description:'方案等待审批；任务尚未进入可执行清单。'},
{id:'proposed-api',title:'实现待审批方案中的 API',status:'proposed',date:'10 月 22 日 14:45',kind:'chain',description:'前置方案仍待审批；当前任务同样等待审批，不计入可开始或被阻塞。'},
{id:'proposed-independent',title:'评估独立的命令交互方案',status:'proposed',date:'10 月 22 日 14:50',kind:'standalone',description:'独立任务等待审批，即使没有前置任务也不可开始。'},
{id:'attachment-plan',title:'确定任务附件存储与访问接口',status:'done',date:'10 月 21 日 10:20',kind:'chain',description:'统一附件元数据与文件存储接口，明确单文件操作和失败处理。'},
{id:'attachment-api',title:'实现附件上传、预览与下载',status:'in_progress',date:'10 月 21 日 10:45',kind:'chain',description:'连接 API 与任务详情中的附件操作，验证文件上传和预览。'},
{id:'attachment-ui',title:'接入任务详情中的附件界面，并覆盖长文件名和移动端预览场景',status:'todo',date:'10 月 21 日 11:10',kind:'chain',blocked:true,description:'展示附件列表、上传进度和操作失败信息。'},
{id:'storage-check',title:'验证本地存储配置',status:'done',date:'10 月 21 日 09:35',kind:'chain',description:'验证部署环境中的存储目录与文件访问。'},
{id:'attachment-acceptance',title:'完成真实客户端验收',status:'todo',date:'10 月 21 日 13:05',kind:'chain',blocked:true,shared:true,description:'结合附件接口与部署配置，在真实客户端完成上传、下载和删除验收。'},
{id:'completed-setup',title:'完善首次启动配置引导',status:'done',date:'10 月 20 日 16:40',kind:'chain',description:'引导配置服务地址与 review 仓库。'},
{id:'completed-check',title:'验证配置引导流程',status:'done',date:'10 月 20 日 17:20',kind:'chain',description:'验证独立能力配置与已有配置保留。'},
{id:'release-notes',title:'整理发布说明',status:'todo',date:'10 月 22 日 14:18',kind:'standalone',description:'整理本次发布中的用户可见行为与升级说明。'},
{id:'readme-links',title:'检查 README 中的文档入口，修复重新组织后的链接并核对所有有效文档的归属',status:'in_progress',date:'10 月 22 日 12:35',kind:'standalone',description:'核对文档导航与目录中的当前入口，保留各文档的职责。'},
{id:'avatar',title:'更新团队账号头像',status:'done',date:'10 月 21 日 18:10',kind:'standalone',description:'更新团队账号的项目头像。'},
{id:'cli-help',title:'核对 CLI 帮助中的示例',status:'todo',date:'10 月 21 日 16:25',kind:'standalone',description:'检查帮助示例与实际命令参数是否一致。'}
];
const chains=[{id:'proposed-plan',title:'确定下一阶段的项目任务方案',ids:['proposed-plan','proposed-api'],date:'10 月 22 日 14:40'},{id:'attachment-plan',title:'确定任务附件存储与访问接口',ids:['attachment-plan','attachment-api','attachment-ui','attachment-acceptance'],date:'10 月 21 日 10:20'},{id:'storage-check',title:'验证本地存储配置',ids:['storage-check','attachment-acceptance'],date:'10 月 21 日 09:35'},{id:'completed-setup',title:'完善首次启动配置引导',ids:['completed-setup','completed-check'],date:'10 月 20 日 16:40'}];
const labels={proposed:'待审批',todo:'待处理',in_progress:'进行中',done:'已完成'};
let scenario='mixed',project='daynight',prefs=null,taskDetailTrigger=null,fullscreenRoot=null;
const fallback=()=>({tab:'chains',completed:{standalone:false,chains:false},expanded:'attachment-plan',positions:{standalone:0,chains:0}});
const readPrefs=()=>{const raw=localStorage.getItem('daynight-task-views-mockup:'+project);return raw?JSON.parse(raw):fallback();};
const savePrefs=()=>localStorage.setItem('daynight-task-views-mockup:'+project,JSON.stringify(prefs));
const byId=id=>activeTasks().find(t=>t.id===id);

const badge=t=>`<span class="root-status graph-status-${t.status}">${labels[t.status]}</span>`;
const status=t=>`<span class="graph-status graph-status-${t.status}"><i></i>${labels[t.status]}</span>`;
const chainProgress=c=>{const nodes=c.ids.map(byId),done=nodes.filter(t=>t.status==='done').length;return {done,total:nodes.length,status:done===nodes.length?'done':nodes.some(t=>t.status==='in_progress'||t.status==='done')?'in_progress':nodes.some(t=>t.status==='todo')?'todo':'proposed'};};
function stats(){const ts=activeTasks(),done=ts.filter(t=>t.status==='done').length,todo=ts.filter(t=>t.status==='todo'),blocked=todo.filter(t=>t.blocked).length;return `<section class="stats" aria-label="整个项目的任务统计">${[['','任务总数',ts.length,'按任务 ID 去重'],['done','已完成',done,`完成比例 ${ts.length?Math.round(done/ts.length*100):0}%`],['proposed','待审批',ts.filter(t=>t.status==='proposed').length,'等待确认执行'],['','待处理',todo.length,'等待开始'],['active','进行中',ts.filter(t=>t.status==='in_progress').length,'正在推进'],['ready','可开始',todo.length-blocked,'待处理的子集'],['blocked','被阻塞',blocked,'待处理的子集']].map(([c,l,n,f])=>`<div class="stat ${c}"><p class="stat-label">${l}</p><p class="stat-number">${n}</p><p class="stat-foot">${f}</p></div>`).join('')}</section>`;}

function standaloneView(){const all=activeTasks().filter(t=>t.kind==='standalone'),visible=all.filter(t=>prefs.completed.standalone||t.status!=='done');if(!all.length)return emptyView('还没有独立任务','没有前置任务和后续任务的任务会显示在这里。');if(!visible.length)return emptyView('所有独立任务均已完成','开启“显示已完成”查看这些任务。',true);return `<ul class="standalone-list">${visible.map(t=>`<li><button type="button" class="standalone-row" data-task="${t.id}"><span class="root-heading"><span class="root-title">${escapeHtml(t.title)}</span><span class="root-meta">${t.id} · 创建于 ${t.date}</span></span><span class="task-row-status">${badge(t)}${t.status==='todo'?'<span class="task-ready">可开始</span>':''}</span><span class="standalone-chevron" aria-hidden="true">›</span></button></li>`).join('')}</ul>`;}
function graphNodes(root){if(root==='proposed-plan')return [{id:root,x:50,y:96},{id:'proposed-api',x:375,y:96}];if(root==='storage-check')return [{id:root,x:28,y:33},{id:'attachment-ui',x:28,y:176,boundary:true},{id:'attachment-acceptance',x:445,y:104}];if(root==='completed-setup')return [{id:root,x:50,y:96},{id:'completed-check',x:375,y:96}];return [{id:root,x:28,y:33},{id:root==='storage-check'?'attachment-plan':'storage-check',x:28,y:176,boundary:true},{id:'attachment-api',x:305,y:33},{id:'attachment-ui',x:305,y:176},{id:'attachment-acceptance',x:615,y:104}];}
function graph(root){const nodes=graphNodes(root),done=root==='completed-setup',edges=done||root==='proposed-plan'?[[0,1]]:root==='storage-check'?[[0,2],[1,2]]:[[0,2],[2,3],[3,4],[1,4]];return `<div class="task-graph" id="graph-${root}"><div class="graph-toolbar"><span>${done||root==='proposed-plan'?'2 个任务 · 1 条依赖':root==='storage-check'?'2 个链内任务 · 1 个前置边界':'4 个链内任务 · 1 个前置边界'}</span><span class="graph-toolbar-actions"><span>${done?'已全部完成':'共享节点按任务 ID 去重'}</span><button type="button" class="button graph-fullscreen-toggle" data-fullscreen="${root}">⛶ 全屏</button></span></div><p class="graph-instructions">拖动滚动条浏览依赖图；点击任务查看详情。虚线节点是当前链外的前置任务。</p><div class="graph-shell"><div class="mock-canvas" tabindex="0" aria-label="可滚动任务依赖图"><div class="mock-graph-space"><svg class="mock-edges" width="900" height="300" aria-hidden="true"><defs><marker id="arrow-${root}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#abb5c8"/></marker></defs>${edges.map(([a,b])=>{const s=nodes[a],e=nodes[b],x1=s.x+214,y1=s.y+41,x2=e.x,y2=e.y+41;return `<path d="M ${x1} ${y1} C ${x1+40} ${y1}, ${x2-40} ${y2}, ${x2} ${y2}" stroke="#abb5c8" fill="none" stroke-width="1.5" marker-end="url(#arrow-${root})"/>`;}).join('')}</svg>${nodes.map(n=>{const t=byId(n.id);return `<button type="button" class="task-node task-node-${t.status} ${n.boundary?'task-node-boundary':''}" style="left:${n.x}px;top:${n.y}px" data-task="${t.id}"><span class="task-node-meta"><span class="task-node-id">${t.id}</span>${t.shared?'<span class="task-shared-label">共享节点</span>':''}</span><span class="task-node-title">${escapeHtml(t.title)}</span><span class="task-node-bottom">${status(t)}${t.status==='todo'&&t.blocked?'<span class="graph-blocked-badge">被阻塞</span>':''}</span>${n.boundary?'<span class="task-boundary-label">链外前置任务</span>':''}</button>`;}).join('')}</div></div><div class="mock-graph-controls" aria-label="图缩放"><button type="button" data-zoom="-1" aria-label="缩小">−</button><button type="button" data-zoom="1" aria-label="放大">+</button><button type="button" data-fit>适应视图</button></div></div><div class="graph-foot"><span>箭头从前置任务指向后续任务</span><span>${done?'完成的依赖关系仍保留在任务链中':'已完成的前置任务仍属于任务链'}</span></div></div>`;}
function chainsView(){const all=activeChains(),visible=all.filter(c=>prefs.completed.chains||chainProgress(c).status!=='done');if(!all.length)return emptyView('还没有任务链','存在依赖关系的任务会在这里按根任务展示。');if(!visible.length)return emptyView('所有任务链均已完成','开启“显示已完成”查看这些任务链。',true);return `<ul class="root-list">${visible.map(c=>{const p=chainProgress(c),expanded=prefs.expanded===c.id;return `<li class="root-row ${expanded?'expanded':''}"><button class="root-toggle" type="button" data-expand="${c.id}" aria-expanded="${expanded}" aria-controls="graph-${c.id}">${icons.chevron}<span class="root-heading"><span class="root-title">${escapeHtml(c.title)}</span><span class="root-meta">${p.total} 个任务 · ${p.total-p.done} 个未完成</span></span><span class="root-progress"><span class="root-progress-label">${p.done} / ${p.total} 已完成</span><span class="root-progress-track"><i style="width:${p.done/p.total*100}%"></i></span></span><span class="root-status graph-status-${p.status}">${labels[p.status]}</span></button>${expanded?graph(c.id):''}</li>`;}).join('')}</ul>`;}
function toolbar(){const chain=prefs.tab==='chains',all=chain?activeChains():activeTasks().filter(t=>t.kind==='standalone'),done=all.filter(t=>chain?chainProgress(t).status==='done':t.status==='done').length,visible=prefs.completed[prefs.tab]?all.length:all.length-done;return `<div class="task-view-toolbar">${all.length?`<label class="completed-chain-control"><input id="completed" type="checkbox" ${prefs.completed[prefs.tab]?'checked':''}>显示已完成${chain?'任务链':'独立任务'}（${done}）</label>`:''}<span class="task-view-summary">最新创建在前 · ${visible} / ${all.length} ${chain?'条任务链':'个独立任务'}</span></div><p class="graph-note">${chain?'按根任务创建时间倒序排列，从没有前置依赖的任务开始展开。共享任务可能出现在多条任务链中，各链进度不能相加作为项目总数。':'按创建时间倒序排列。独立任务没有前置或后续依赖，点击任务直接查看详情。'}</p>`;}
function render(){const name=project==='daynight'?'Daynight':'团队网站';document.getElementById('project-name').textContent=name;document.getElementById('crumb-project').textContent=name;document.getElementById('project-repo').textContent=project==='daynight'?'https://github.com/oc-engteam/day-night':'https://github.com/oc-engteam/website';document.getElementById('stage').classList.toggle('narrow',scenario==='narrow');const content=document.getElementById('project-content');if(scenario==='loading'){content.innerHTML='<section class="state-box" role="status" style="margin-top:26px"><span class="spinner" aria-hidden="true"></span><h2>正在加载任务图</h2><p>正在读取项目任务和依赖关系。</p></section>';return;}if(scenario==='error'){content.innerHTML='<section class="state-box" role="alert" style="margin-top:26px"><h2>项目加载失败</h2><p>无法连接服务，请检查本地服务后重试。</p><button type="button" class="button primary" data-retry>重试</button></section>';bindContent();return;}content.innerHTML=`${scenario==='refresh-error'?'<section class="snapshot-error" role="alert"><h2>刷新失败</h2><p>仍显示上次成功读取的数据。无法连接服务，请检查本地服务后重试。</p><button type="button" class="button" data-retry>重试刷新</button></section>':''}${stats()}${tabs()}<section id="task-panel" role="tabpanel" aria-labelledby="tab-${prefs.tab}">${toolbar()}${prefs.tab==='chains'?chainsView():standaloneView()}</section>`;bindContent();}
function switchTab(tab,focus=false){prefs.positions[prefs.tab]=window.scrollY;prefs.tab=tab;savePrefs();render();if(focus)document.getElementById('tab-'+tab).focus();requestAnimationFrame(()=>window.scrollTo(0,prefs.positions[tab]));}
function bindContent(){document.querySelectorAll('[data-tab]').forEach(el=>{el.onclick=()=>switchTab(el.dataset.tab);el.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();switchTab(e.key==='Home'?'standalone':e.key==='End'?'chains':prefs.tab==='chains'?'standalone':'chains',true);}};});const completed=document.getElementById('completed');if(completed)completed.onchange=()=>{prefs.completed[prefs.tab]=completed.checked;savePrefs();render();};document.querySelectorAll('[data-show-completed]').forEach(el=>el.onclick=()=>{prefs.completed[prefs.tab]=true;savePrefs();render();});document.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{prefs.expanded=prefs.expanded===el.dataset.expand?null:el.dataset.expand;savePrefs();render();});document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.task,el));document.querySelectorAll('[data-fullscreen]').forEach(el=>el.onclick=()=>toggleFullscreen(el.dataset.fullscreen));document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>{const space=el.closest('.graph-shell').querySelector('.mock-graph-space'),zoom=Number(space.dataset.zoom||'1')+Number(el.dataset.zoom)*.1;space.dataset.zoom=String(Math.max(.4,Math.min(1.6,zoom)));space.style.transform=`scale(${space.dataset.zoom})`;});document.querySelectorAll('[data-fit]').forEach(el=>el.onclick=()=>{const canvas=el.closest('.graph-shell').querySelector('.mock-canvas'),space=canvas.querySelector('.mock-graph-space'),zoom=Math.min(1,canvas.clientWidth/900);space.dataset.zoom=String(zoom);space.style.transform=`scale(${zoom})`;canvas.scrollTo(0,0);});document.querySelectorAll('[data-retry]').forEach(el=>el.onclick=()=>refresh());}
function toggleFullscreen(root){const el=document.getElementById('graph-'+root),open=fullscreenRoot===null;fullscreenRoot=open?root:null;el.classList.toggle('task-graph-fullscreen',open);el.querySelector('[data-fullscreen]').textContent=open?'⛶ 退出全屏':'⛶ 全屏';document.body.style.overflow=open?'hidden':'';}
function closeTaskDetail(){document.getElementById('task-detail').hidden=true;document.body.style.overflow=fullscreenRoot?'hidden':'';if(taskDetailTrigger&&taskDetailTrigger.isConnected)taskDetailTrigger.focus();}
function openTaskDetail(id,trigger){taskDetailTrigger=trigger;const t=byId(id),dialog=document.getElementById('task-detail');const chain=t.kind==='chain',relations=chain?(id==='proposed-plan'?['proposed-api']:id==='proposed-api'?['proposed-plan']:id==='attachment-acceptance'?['attachment-ui','storage-check']:id==='attachment-api'?['attachment-plan','attachment-ui']:id==='storage-check'?['attachment-acceptance']:[]):[];dialog.innerHTML=`<section class="task-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="task-detail-title"><header class="task-detail-header"><h2>任务详情</h2><button type="button" class="button task-detail-close" aria-label="关闭任务详情">✕</button></header><div class="task-detail-body"><div class="task-detail-heading"><p class="task-detail-id">${t.id}</p><h3 class="task-detail-title" id="task-detail-title">${escapeHtml(t.title)}</h3><div class="task-detail-badges"><span class="task-detail-status task-detail-status-${t.status}">${labels[t.status]}</span>${t.status==='todo'&&t.blocked?'<span class="task-detail-blocked">被阻塞</span>':t.status==='todo'?'<span class="task-detail-ready">可开始</span>':''}</div></div><div class="task-detail-columns"><div class="task-detail-main"><section class="task-detail-section"><h4>任务描述</h4><div class="task-detail-description"><p>${t.description}</p></div></section></div><aside class="task-detail-aside" aria-label="任务关系与元数据"><section class="task-detail-section"><h4>${chain?'任务关系':'依赖关系'}</h4>${relations.length?`<ul class="task-detail-relations">${relations.map(r=>{const n=byId(r);return `<li><button class="task-detail-relation" type="button" data-relation="${r}"><span class="task-detail-relation-dot task-detail-dot-${n.status}"></span><span>${escapeHtml(n.title)}</span><span class="task-detail-relation-arrow">→</span></button></li>`;}).join('')}</ul>`:`<p class="task-detail-description">${chain?'当前为任务链的根任务。':'没有前置任务，也没有后续任务。'}</p>`}</section><section class="task-detail-section"><h4>任务信息</h4><dl class="task-detail-metadata"><div><dt>任务 ID</dt><dd class="task-detail-full-id">${t.id}</dd></div><div><dt>创建时间</dt><dd>${t.date}</dd></div><div><dt>所在项目</dt><dd>${project==='daynight'?'Daynight':'团队网站'}</dd></div></dl></section></aside></div></div><footer class="task-detail-footer">任务详情保留当前页签、筛选和浏览位置。</footer></section>`;dialog.hidden=false;document.body.style.overflow='hidden';dialog.querySelector('.task-detail-close').onclick=closeTaskDetail;dialog.onclick=e=>{if(e.target===dialog)closeTaskDetail();};dialog.querySelectorAll('[data-relation]').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.relation,trigger));dialog.querySelector('.task-detail-close').focus();}
function refresh(){const btn=document.getElementById('refresh');btn.disabled=true;btn.textContent='正在刷新…';setTimeout(()=>{if(['error','loading','refresh-error'].includes(scenario)){scenario='mixed';document.getElementById('scenario').value='mixed';}document.getElementById('snapshot-time').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});btn.disabled=false;btn.textContent='刷新';render();},500);}
document.getElementById('scenario').onchange=e=>{if(fullscreenRoot)toggleFullscreen(fullscreenRoot);closeTaskDetail();scenario=e.target.value;render();};document.getElementById('project').onchange=e=>{prefs.positions[prefs.tab]=window.scrollY;savePrefs();project=e.target.value;prefs=readPrefs();render();requestAnimationFrame(()=>window.scrollTo(0,prefs.positions[prefs.tab]));};document.getElementById('reset').onclick=()=>{prefs=fallback();savePrefs();render();window.scrollTo(0,0);};document.getElementById('project-nav').onclick=()=>{const select=document.getElementById('project');select.value=project==='daynight'?'website':'daynight';select.dispatchEvent(new Event('change'));};document.getElementById('refresh').onclick=refresh;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('task-detail').hidden)closeTaskDetail();else if(fullscreenRoot)toggleFullscreen(fullscreenRoot);}if(e.key==='Tab'&&!document.getElementById('task-detail').hidden){const nodes=[...document.getElementById('task-detail').querySelectorAll('button')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('beforeunload',()=>{prefs.positions[prefs.tab]=window.scrollY;savePrefs();});prefs=readPrefs();render();requestAnimationFrame(()=>window.scrollTo(0,prefs.positions[prefs.tab]));
</script>
</body>
</html>
