<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daynight · 项目与任务</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--ink:#172132;--muted:#737d8e;--line:#e5e8ee;--indigo:#5c5ce0;--green:#218461;--blue:#436ac5;--amber:#ad7426;--shadow:0 8px 28px #1c285808}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8c8cf0;outline-offset:3px}
button{color:inherit}
button:disabled{cursor:default}
svg{flex:none}
.shell{background:#171e2c;min-height:100vh;display:grid;grid-template-columns:190px minmax(0,1fr)}
.sidebar{background:#171e2c;color:#a7b0c2;padding:30px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:23px;font-weight:650;letter-spacing:-1px;padding:0 12px 40px}
.brand-mark{width:25px;height:25px;border-radius:50%;background:linear-gradient(90deg,#e6e6ff 50%,#7777ec 50%);box-shadow:0 0 0 5px #ffffff08}
.nav-label{font-size:10px;letter-spacing:2px;color:#69778e;padding:0 14px 13px}
.nav-button{width:100%;border:0;border-radius:7px;display:flex;align-items:center;gap:11px;padding:12px 14px;background:#ffffff0d;color:#f0f1ff;text-align:left}
.nav-button svg{color:#a3a3ff}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff10;padding:19px 12px 0;font-size:12px}
.server-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#74b99c;margin-right:7px}
.sidebar-bottom small{display:block;color:#647187;margin-top:5px;font-size:11px}
.workspace{min-width:0;background:var(--bg)}
.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:15px}
.crumb{color:#8790a0;display:flex;align-items:center;gap:12px;font-size:13px;min-width:0}
.crumb-current{color:#344258;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.text-button{padding:0;border:0;background:none;color:#69768b}
.local-label{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:#7c8799;white-space:nowrap}
.content{max-width:1500px;margin:auto;padding:34px 40px 64px}
.eyebrow{color:var(--indigo);font-size:11px;font-weight:650;letter-spacing:1.5px;margin:0 0 7px}
.page-heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}
h1{font-size:28px;letter-spacing:-.7px;line-height:1.3;margin:0 0 9px;font-weight:650}
h2,h3,p{margin:0}
.subtitle{color:var(--muted);font-size:13px}
.button{border:1px solid #dce0e8;border-radius:7px;background:#fff;padding:8px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;white-space:nowrap;box-shadow:0 1px 2px #1c285803}
.button:hover{background:#f5f5fd;border-color:#c9c9ec}
.button.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.project-card{border:1px solid var(--line);border-radius:11px;background:white;text-align:left;padding:25px;min-height:240px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:border-color .15s,transform .15s;min-width:0}
.project-card:hover{border-color:#b6b6e8;transform:translateY(-2px)}
.project-icon{width:42px;height:42px;background:#efeffd;color:var(--indigo);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.project-card:nth-child(2) .project-icon{background:#ebf5f0;color:#4f8b72}
.project-card:nth-child(3) .project-icon{background:#fbf1e6;color:#ad8658}
.project-name{font-size:17px;font-weight:650;margin-bottom:8px}
.repo{display:flex;gap:7px;align-items:center;color:#838b9a;font-size:11px;min-width:0;overflow-wrap:anywhere}
.repo span{min-width:0}
.project-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:30px;color:#96a0ae;font-size:11px}
.project-footer svg{color:#8888c7}
.list-footer{font-size:11px;color:#929ba9;text-align:center;margin-top:35px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:26px 0 30px}
.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 18px 15px}
.stat-label{color:#7d8797;font-size:11px;display:flex;align-items:center;gap:7px}
.stat-number{font-size:28px;font-weight:620;letter-spacing:-1px;margin:7px 0 3px;line-height:1.3}
.stat-foot{font-size:10px;color:#9aa2af}
.stat.done .stat-number{color:var(--green)}
.stat.active .stat-number{color:var(--blue)}
.stat.ready .stat-number{color:var(--indigo)}
.stat.blocked .stat-number{color:var(--amber)}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}
.section-heading h2{font-size:15px;font-weight:650;display:flex;align-items:center;gap:9px}
.count-pill{background:#e9ecf1;color:#788293;padding:0 7px;border-radius:4px;font-size:10px;line-height:19px}
.legend{display:flex;gap:14px;color:#7b8594;font-size:10px}
.legend-item{display:flex;gap:5px;align-items:center}
.dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:#98a2b3}
.dot.done{background:#398e6b}
.dot.in_progress{background:#5d7ed2}
.graph-note{font-size:11px;color:#939cab;margin:0 0 14px}
.root-list{display:flex;flex-direction:column;gap:12px}
.root-row{border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 2px 8px #1c285802}
.root-toggle{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff;text-align:left;padding:19px 21px}
.root-toggle:hover{background:#fcfcff}
.chevron{color:#96a0af;transition:transform .15s}
.root-row.expanded .chevron{transform:rotate(90deg)}
.root-heading{min-width:0;flex:1}
.root-title{font-size:13px;font-weight:650;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.root-meta{font-size:10px;color:#99a1ae;margin-top:5px}
.root-progress{width:136px;margin:0 15px;text-align:right;flex:none}
.progress-label{font-size:10px;color:#8b94a3;margin-bottom:7px}
.progress{display:block;height:4px;background:#eef0f4;border-radius:10px;overflow:hidden}
.progress i{display:block;height:100%;background:#78ac94;border-radius:10px}
.status{font-size:10px;padding:2px 7px;border-radius:4px;background:#eef0f4;color:#7d8797;white-space:nowrap;font-weight:500}
.status.done{background:#eaf5ef;color:#398567}
.status.in_progress{background:#edf1fc;color:#5574be}
.blocked-badge{background:#fff5e5;color:#a77933;border:1px solid #f0dfbe;font-size:9px;padding:1px 5px;border-radius:4px;white-space:nowrap}
.graph-toolbar{border-top:1px solid #eef0f4;background:#fcfcfe;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px}
.graph-caption{display:flex;align-items:center;gap:7px;font-size:10px;color:#8a94a4}
.graph-controls{display:flex;align-items:center;gap:4px}
.icon-button{border:1px solid #e4e7ee;border-radius:5px;background:#fff;width:27px;height:27px;display:flex;align-items:center;justify-content:center}
.icon-button:hover{background:#eeeffc}
.zoom-label{width:43px;text-align:center;font-size:10px;color:#8a92a0}
.fit-button{font-size:10px;padding:5px 8px;margin-left:5px}
.graph-scroll{height:445px;max-width:100%;overflow:auto;background-color:#fafbfe;background-image:radial-gradient(#d9dee9 .8px,transparent .8px);background-size:18px 18px;overscroll-behavior:contain}
.graph-space{position:relative;min-width:100%;min-height:100%}
.graph-canvas{position:absolute;transform-origin:0 0}
.graph-edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.task-node{position:absolute;width:220px;height:96px;border:1px solid #dce1ea;border-radius:7px;background:#fff;box-shadow:0 3px 7px #27386206;text-align:left;padding:12px 13px;display:flex;flex-direction:column;align-items:stretch;transition:box-shadow .15s,border-color .15s}
.task-node:hover{box-shadow:0 4px 12px #3a42751c;border-color:#9a9bdf}
.task-node.done{border-left:3px solid #69a48a}
.task-node.in_progress{border-left:3px solid #738ed8;background:#fcfdff}
.task-node.todo{border-left:3px solid #bdc6d3}
.task-node.boundary{border-style:dashed;box-shadow:none;background:#f6f7fa}
.node-meta{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#a1a8b4;margin-bottom:7px}
.shared-label{color:#9c8ac1;background:#f4f0fb;padding:0 4px;border-radius:3px;font-size:8px}
.boundary-label{color:#8f98a7}
.node-title{font-size:12px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:17px}
.node-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:5px}
.node-status{font-size:9px;color:#8792a2;display:flex;gap:5px;align-items:center}
.graph-foot{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid #eef0f4;font-size:9px;color:#9aa3b0}
.state-box{border:1px solid var(--line);border-radius:11px;background:#fff;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px;gap:12px;color:#7b8799}
.state-icon{width:60px;height:60px;background:#f2f2fb;color:#9393cd;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.state-box h2{color:#45516a;font-size:17px}
.state-box p{font-size:12px;max-width:390px}
.spinner{width:27px;height:27px;border:2px solid #e6e6f6;border-top-color:#7979d9;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}
.preview{position:fixed;left:208px;bottom:12px;z-index:15;background:#fffefef2;border:1px solid #e2e4ed;border-radius:8px;box-shadow:0 4px 22px #25325312;display:flex;align-items:center;gap:9px;padding:7px 10px;max-width:calc(100vw - 225px);backdrop-filter:blur(8px)}
.preview-label{font-size:9px;color:#9b8b72;white-space:nowrap}
.preview select{max-width:165px;font-size:10px;border:0;background:#f4f5f8;color:#748096;padding:4px 20px 4px 7px;border-radius:4px}
.preview-hint{font-size:9px;color:#a0a7b4;white-space:nowrap}
.drawer-backdrop{position:fixed;inset:0;background:#19233540;z-index:30;display:flex;justify-content:flex-end;backdrop-filter:blur(1px)}
.drawer{height:100%;width:460px;max-width:100%;background:#fff;box-shadow:-12px 0 45px #17244716;display:flex;flex-direction:column;animation:slide .2s ease-out}
.drawer-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:23px 27px;font-size:12px;color:#8b94a3}
.drawer-body{padding:29px 28px;overflow:auto;flex:1}
.drawer-id{font-size:10px;color:#98a0ae;margin-bottom:10px}
.drawer-title{font-size:23px;line-height:1.5;font-weight:650;letter-spacing:-.3px;margin-bottom:17px;overflow-wrap:anywhere}
.drawer-badges{display:flex;gap:8px;align-items:center;margin-bottom:26px}
.drawer-section{border-top:1px solid #edf0f4;padding-top:21px;margin-top:22px}
.drawer-section h3{font-size:10px;color:#939cab;font-weight:550;margin-bottom:11px;letter-spacing:.5px}
.description{white-space:pre-wrap;color:#637087;font-size:12px;line-height:1.9;overflow-wrap:anywhere}
.relation{width:100%;display:flex;gap:10px;align-items:center;border:1px solid #e9ecf2;background:#fff;border-radius:6px;padding:11px;text-align:left;margin:7px 0;font-size:11px}
.relation:hover{background:#f7f7fd}
.relation span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.relation svg{color:#9b9fc0}
.detail-line{display:flex;justify-content:space-between;gap:15px;color:#8a95a6;font-size:10px;padding:5px 0}
.detail-line strong{font-weight:400;color:#68758b;text-align:right}
.drawer-footer{border-top:1px solid var(--line);padding:16px 28px;color:#a3aab6;font-size:10px}
.no-scroll{overflow:hidden}
@keyframes slide{from{transform:translateX(25px);opacity:.5}
to{transform:translateX(0);opacity:1}
}
[hidden]{display:none!important}
@media(max-width:1150px){.shell{grid-template-columns:156px minmax(0,1fr)}
.sidebar{padding-left:12px;padding-right:12px}
.brand{font-size:20px;padding-left:8px}
.topbar{padding:0 28px}
.content{padding-left:28px;padding-right:28px}
.project-grid{gap:14px}
.project-card{padding:20px}
.stats{gap:8px}
.stat{padding:15px 12px}
.stat-label{font-size:10px}
.preview{left:171px;max-width:calc(100vw - 187px)}
.preview-hint{display:none}
}
@media(max-width:850px){.project-grid{grid-template-columns:1fr}
.project-card{min-height:170px;position:relative;padding:22px 22px 18px 83px}
.project-icon{position:absolute;left:22px;top:23px}
.project-footer{padding-top:20px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.legend{gap:9px}
.root-progress{width:105px;margin:0 5px}
.stat-number{font-size:26px}
}
@media(max-width:600px){.shell{display:block}
.sidebar{position:static;height:59px;display:flex;flex-direction:row;align-items:center;padding:0 18px;justify-content:space-between}
.brand{padding:0;font-size:19px}
.brand-mark{width:19px;height:19px}
.nav-label,.sidebar-bottom{display:none}
.nav-button{width:auto;font-size:11px;padding:7px 10px;gap:7px}
.topbar{height:55px;padding:0 19px}
.content{padding:25px 18px 78px}
.local-label{font-size:9px;padding:3px 8px}
.crumb{font-size:11px;gap:9px}
.page-heading{gap:12px;margin-bottom:22px;align-items:flex-start}
h1{font-size:23px}
.subtitle{font-size:11px}
.eyebrow{font-size:9px}
.button{font-size:10px;padding:7px 10px}
.stats{gap:7px;margin:22px 0}
.stat{padding:13px 11px}
.stat-label{font-size:9px}
.stat-foot{font-size:8px}
.stat-number{font-size:24px}
.section-heading{align-items:flex-start}
.section-heading h2{font-size:13px}
.legend{font-size:8px;gap:7px;padding-top:4px}
.graph-note{font-size:10px;line-height:1.7}
.root-toggle{gap:8px;padding:16px 12px;flex-wrap:wrap}
.root-title{font-size:12px;gap:6px}
.root-heading{min-width:0}
.root-meta{font-size:9px}
.root-progress{width:70px;margin:0}
.progress-label{font-size:8px}
.root-toggle>.status{display:none}
.graph-toolbar{padding:10px 12px;flex-wrap:wrap}
.graph-caption{font-size:9px}
.graph-scroll{height:360px}
.graph-foot{padding:9px 12px;font-size:8px;flex-wrap:wrap}
.preview{left:12px;right:12px;max-width:none;bottom:9px;justify-content:center}
.preview-label{font-size:9px}
.drawer-header{padding:18px 21px}
.drawer-body{padding:24px 21px}
.drawer-title{font-size:21px}
.project-name{font-size:15px}
.project-card{padding-right:17px}
.repo{font-size:10px}
.root-progress .progress-label span{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="page-shell"><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span>daynight</div><div><div class="nav-label">工作空间</div><button class="nav-button" id="nav-projects"></button></div><div class="sidebar-bottom"><span class="server-dot"></span>本地工作空间<small>任务与依赖，一处看清</small></div></aside><div class="workspace"><header class="topbar"><nav class="crumb" id="breadcrumbs" aria-label="面包屑"></nav><span class="local-label">工作空间 · 本地</span></header><main class="content" id="app"></main></div></div><aside class="preview" aria-label="设计预览控制"><span class="preview-label">预览状态</span><select id="preview-state" aria-label="预览状态"><option value="normal">正常数据</option><option value="empty-list">项目列表为空</option><option value="loading">正在加载</option><option value="error">加载失败</option><option value="empty-project">空项目</option></select><span class="preview-hint">离线交互示意</span></aside></div>
<div id="overlay"></div>
<script>
'use strict';
const icon = (name, size = 16) => {
  const paths = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    repo:'<path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1 0-4h13M8 7h7M8 10h5"/>',
    arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
    chevron:'<path d="m9 5 7 7-7 7"/>',
    refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    tree:'<rect x="3" y="9" width="5" height="6" rx="1"/><rect x="16" y="3" width="5" height="6" rx="1"/><rect x="16" y="15" width="5" height="6" rx="1"/><path d="M8 12h4V6h4M12 12v6h4"/>',
    fit:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    alert:'<path d="m12 3 10 18H2L12 3Zm0 6v5m0 3h.01"/>',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.grid}</svg>`;
};
const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const labels = { todo:'待处理', in_progress:'进行中', done:'已完成' };
const makeTask = (id, title, status, dependsOn, description = '') => ({id,title,status,dependsOn,description:description || `${title}。完成后需要验证实际使用路径，并保留清晰的失败信息。`,createdAt:'2026-10-18 09:00 UTC',updatedAt:'2026-10-20 03:00 UTC'});
const projects = [
  {id:'workspace',name:'任务管理工作台',repo:'github.com/codetreker/daynight',createdAt:'2026-10-18',tasks:[
    makeTask('T-01','项目与 API 基础','done',[],'建立项目与任务的核心 API，为页面提供稳定的数据来源。\n任务之间使用依赖关系，不增加父子任务层级。'),
    makeTask('T-02','交互与视觉规范','done',[],'确定项目概览、任务图和详情侧栏的统一视觉与操作。'),
    makeTask('T-03','发布前检查','todo',[],'独立检查运行配置和发布说明。它也是最终交付任务的前置条件。'),
    makeTask('T-04','项目列表接口','done',['T-01']),
    makeTask('T-05','任务图一致快照','done',['T-01']),
    makeTask('T-06','项目列表页面','done',['T-04','T-02']),
    makeTask('T-07','横向依赖图布局与节点','in_progress',['T-05','T-02'],'实现从左到右的任务依赖图。\n使用状态颜色与文字，保留共享任务和来自其他任务链的前置节点。'),
    makeTask('T-08','任务详情侧栏','in_progress',['T-05','T-02']),
    makeTask('T-09','项目统计展示','todo',['T-06']),
    makeTask('T-10','依赖图交互验收','todo',['T-07','T-08']),
    makeTask('T-11','Go 服务内嵌页面','todo',['T-06','T-07','T-08']),
    makeTask('T-12','端到端验证与交付','todo',['T-09','T-10','T-11','T-03']),
    makeTask('T-13','整理操作说明与超长任务标题的展示效果，保持完整描述可在详情侧栏阅读','in_progress',[],'这是一个独立任务，没有前置或后续。长标题会在节点里省略，完整标题保留在详情中。\n内容按纯文本显示：<script>不会执行<\/script>。'),
  ]},
  {id:'release',name:'发布工具链',repo:'github.com/example/release-toolkit',createdAt:'2026-10-16',tasks:[makeTask('R-01','整理发布流程','done',[]),makeTask('R-02','完成发布验收','done',['R-01'])]},
  {id:'docs',name:'团队文档',repo:'github.com/example/team-docs',createdAt:'2026-10-20',tasks:[]},
];
let activeProject = null;
let expandedRoot = null;
let previewState = 'normal';
let zoom = 1;
let selectedTask = null;
let returnFocus = null;
let lastRefresh = '03:00:00';
let graphSize = {width:1,height:1};
let requestNumber = 0;
const app = document.getElementById('app');
const shell = document.getElementById('page-shell');
const overlay = document.getElementById('overlay');
const taskMap = () => new Map((activeProject?.tasks || []).map(task => [task.id,task]));
const blockedBy = (task) => task.dependsOn.filter(id => taskMap().get(id).status !== 'done');
const statusBadge = (status) => `<span class="status ${status}">${labels[status]}</span>`;
const roots = () => activeProject.tasks.filter(task => task.dependsOn.length === 0);
const projectSummary = () => {
  const tasks = activeProject.tasks;
  const count = (status) => tasks.filter(task => task.status === status).length;
  const todo = count('todo');
  const blocked = tasks.filter(task => task.status === 'todo' && blockedBy(task).length > 0).length;
  return {total:tasks.length,done:count('done'),todo,inProgress:count('in_progress'),ready:todo-blocked,blocked};
};
const projectRoot = (rootId) => {
  const map = taskMap();
  const next = new Map(activeProject.tasks.map(task => [task.id,[]]));
  activeProject.tasks.forEach(task => task.dependsOn.forEach(id => next.get(id).push(task.id)));
  const main = new Set();
  const visit = (id) => {if(main.has(id))return;main.add(id);next.get(id).forEach(visit);};
  visit(rootId);
  const boundary = new Set();
  main.forEach(id => map.get(id).dependsOn.forEach(dependency => {if(!main.has(dependency))boundary.add(dependency);}));
  const all = new Set([...main,...boundary]);
  const edges = [];
  main.forEach(id => map.get(id).dependsOn.forEach(dependency => edges.push({from:dependency,to:id,external:boundary.has(dependency)})));
  return {main,boundary,all,edges,done:[...main].filter(id=>map.get(id).status==='done').length};
};
const isShared = (id) => roots().filter(root => projectRoot(root.id).main.has(id)).length > 1;
const heading = (title, subtitle, eyebrow = '项目工作空间') => `<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${escapeHTML(title)}</h1><p class="subtitle">${subtitle}</p></div><button class="button" data-action="refresh">${icon('refresh',14)}刷新</button></div>`;
const renderState = (kind) => {
  if(kind==='loading')return `<div class="state-box" role="status"><div class="spinner"></div><h2>正在读取${activeProject?'任务图':'项目'}</h2><p>请稍候，内容加载后会显示在这里。</p></div>`;
  if(kind==='error')return `<div class="state-box" role="alert"><div class="state-icon">${icon('alert',26)}</div><h2>暂时无法加载${activeProject?'任务图':'项目'}</h2><p>请检查本机服务状态，然后重试。读取失败不会显示成零任务。</p><button class="button primary" data-action="retry">重新加载</button></div>`;
  const text = activeProject ? ['这个项目还没有任务','任务创建后，统计与依赖图会出现在这里。'] : ['还没有项目','项目创建后，会显示在这个工作空间中。'];
  return `<div class="state-box"><div class="state-icon">${icon('tree',27)}</div><h2>${text[0]}</h2><p>${text[1]}</p>${activeProject?'<button class="button" data-action="projects">返回项目列表</button>':''}</div>`;
};
const render = () => {
  document.getElementById('nav-projects').innerHTML = `${icon('grid',15)}项目`;
  document.getElementById('breadcrumbs').innerHTML = activeProject ? `<button class="text-button" data-action="projects">项目</button><span>/</span><span class="crumb-current">${escapeHTML(activeProject.name)}</span>` : '<span class="crumb-current">全部项目</span>';
  if(!activeProject){
    app.innerHTML = heading('项目','查看项目进展，沿依赖关系找到下一步。') + (previewState==='loading'||previewState==='error' ? renderState(previewState) : previewState==='empty-list' ? renderState('empty') : `<div class="project-grid">${projects.map(project=>`<button class="project-card" data-project="${project.id}" aria-label="查看${escapeHTML(project.name)}"><span class="project-icon">${icon('repo',23)}</span><span class="project-name">${escapeHTML(project.name)}</span><span class="repo">${icon('repo',12)}<span>${escapeHTML(project.repo)}</span></span><span class="project-footer"><span>创建于 ${project.createdAt}</span><span>查看任务 ${icon('arrow',13)}</span></span></button>`).join('')}</div><p class="list-footer">选择一个项目，查看任务与执行依赖</p>`);
    return;
  }
  const summary = projectSummary();
  const statData = [['任务总数',summary.total,'','按任务去重'],['已完成',summary.done,'done',summary.total?`${Math.round(summary.done/summary.total*100)}% 已完成`:'暂无任务'],['待处理',summary.todo,'','包含可开始与被阻塞'],['进行中',summary.inProgress,'active','正在推进的任务'],['可开始',summary.ready,'ready','待处理中 · 前置已完成'],['被阻塞',summary.blocked,'blocked','待处理中 · 等待前置']];
  const head = heading(activeProject.name,`<span class="repo">${icon('repo',12)}<span>${escapeHTML(activeProject.repo)}</span></span>`,'项目概览');
  const errorOrLoading = previewState==='loading'||previewState==='error';
  app.innerHTML = head + (errorOrLoading ? renderState(previewState) : `<div class="stats">${statData.map(([label,value,style,foot])=>`<section class="stat ${style}" aria-label="${label}"><div class="stat-label">${label}</div><div class="stat-number">${value}</div><div class="stat-foot">${foot}</div></section>`).join('')}</div>` + (summary.total === 0 ? renderState('empty') : `<div class="section-heading"><h2>${icon('tree',17)}任务链<span class="count-pill">${roots().length} 个起点</span></h2><div class="legend"><span class="legend-item"><i class="dot"></i>待处理</span><span class="legend-item"><i class="dot in_progress"></i>进行中</span><span class="legend-item"><i class="dot done"></i>已完成</span></div></div><p class="graph-note">从没有前置依赖的任务展开 · 共享任务可出现在多条任务链，项目统计只计一次</p><div class="root-list">${roots().map(root=>{
    const graph = projectRoot(root.id);
    const expanded = expandedRoot===root.id;
    return `<section class="root-row ${expanded?'expanded':''}"><button class="root-toggle" id="root-${root.id}" data-root="${root.id}" aria-expanded="${expanded}" aria-controls="graph-${root.id}"><span class="chevron">${icon('chevron',14)}</span><span class="root-heading"><span class="root-title">${escapeHTML(root.title)}</span><span class="root-meta">${root.id} · ${graph.main.size} 个任务${graph.main.size===1?' · 独立任务':''}</span></span>${statusBadge(root.status)}<span class="root-progress"><span class="progress-label">${graph.done} / ${graph.main.size} <span>已完成</span></span><span class="progress"><i style="width:${graph.done/graph.main.size*100}%"></i></span></span></button>${expanded?`<div id="graph-${root.id}"><div class="graph-toolbar"><span class="graph-caption">${icon('arrow',12)}前置在左，后续在右 · 点击节点查看详情</span><div class="graph-controls"><button class="button" data-zoom="out" aria-label="缩小">−</button><span id="zoom-label" style="font-size:10px;color:#8992a1;width:35px;text-align:center"></span><button class="button" data-zoom="in" aria-label="放大">+</button><button class="button" data-zoom="fit">${icon('fit',12)}适应画布</button></div></div><div class="graph-scroll" id="graph-scroll" tabindex="0" aria-label="任务依赖图，可滚动"><div class="graph-space" id="graph-space"><div class="graph-canvas" id="graph-canvas"></div></div></div><div class="graph-foot"><span>虚线节点：外部前置，上游已省略 · 共享：属于多个任务链</span><span>最近刷新 ${lastRefresh} UTC</span></div></div>`:''}</section>`;
  }).join('')}</div>`));
  if(!errorOrLoading&&expandedRoot)requestAnimationFrame(drawGraph);
};
const drawGraph = () => {
  const canvas = document.getElementById('graph-canvas');
  if(!canvas || !expandedRoot)return;
  const graph = projectRoot(expandedRoot);
  const map = taskMap();
  const rank = new Map();
  const level = (id) => {
    if(rank.has(id))return rank.get(id);
    const dependencies = map.get(id).dependsOn;
    const value = dependencies.length ? Math.max(...dependencies.map(level))+1 : 0;
    rank.set(id,value);
    return value;
  };
  [...graph.main].forEach(level);
  const min = Math.min(...[...graph.main].map(id=>rank.get(id)));
  graph.main.forEach(id=>rank.set(id,rank.get(id)-min));
  graph.boundary.forEach(id=>rank.set(id,Math.max(0,Math.min(...graph.edges.filter(edge=>edge.from===id).map(edge=>rank.get(edge.to)))-1)));
  const columns = new Map();
  [...graph.all].sort().forEach(id=>{const column=rank.get(id);if(!columns.has(column))columns.set(column,[]);columns.get(column).push(id);});
  const rows = Math.max(...[...columns.values()].map(ids=>ids.length));
  const positions = new Map();
  columns.forEach((ids,column)=>ids.forEach((id,index)=>positions.set(id,{x:32+column*270,y:32+(rows-ids.length)*63+index*126})));
  graphSize = {width:Math.max(...[...positions.values()].map(position=>position.x))+252,height:rows*126+40};
  const edges = graph.edges.map(edge=>{
    const from=positions.get(edge.from),to=positions.get(edge.to);
    const startX=from.x+220,startY=from.y+48,endX=to.x,endY=to.y+48;
    const mid=(startX+endX)/2;
    return `<path data-edge="${edge.from}:${edge.to}" d="M${startX} ${startY} C${mid} ${startY},${mid} ${endY},${endX} ${endY}" fill="none" stroke="${edge.external?'#a8a9bd':'#bbc3d4'}" stroke-width="1.4" ${edge.external?'stroke-dasharray="5 4"':''} marker-end="url(#arrowhead)"/>`;
  }).join('');
  canvas.innerHTML = `<svg class="graph-edges" width="${graphSize.width}" height="${graphSize.height}" aria-label="依赖连接"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a8b1c3" stroke-width="1.2"/></marker></defs>${edges}</svg>` + [...graph.all].map(id=>{
    const task=map.get(id),position=positions.get(id),external=graph.boundary.has(id),blocked=task.status==='todo'&&blockedBy(task).length>0;
    return `<button class="task-node ${task.status} ${external?'boundary':''}" data-task="${id}" data-external="${external}" style="left:${position.x}px;top:${position.y}px" aria-label="${escapeHTML(task.title)}，${labels[task.status]}${external?'，外部前置，上游已省略':''}"><span class="node-meta"><span>${id}</span><span>${external?'外部前置':isShared(id)?'共享':''}</span></span><span class="node-title">${escapeHTML(task.title)}</span><span class="node-bottom"><span class="node-status"><i class="dot ${task.status}"></i>${labels[task.status]}</span>${blocked?'<span class="blocked-badge">等待前置</span>':external?'<span style="font-size:8px;color:#a1a8b4">上游已省略</span>':''}</span></button>`;
  }).join('');
  canvas.style.width=`${graphSize.width}px`;
  canvas.style.height=`${graphSize.height}px`;
  fitGraph();
};
const setZoom = (value) => {
  zoom = Math.max(.5,Math.min(1.6,value));
  const canvas=document.getElementById('graph-canvas');
  if(!canvas)return;
  canvas.style.transform=`scale(${zoom})`;
  const space=document.getElementById('graph-space');
  space.style.width=`${graphSize.width*zoom}px`;
  space.style.height=`${graphSize.height*zoom}px`;
  document.getElementById('zoom-label').textContent=`${Math.round(zoom*100)}%`;
};
const fitGraph = () => {
  const scroll=document.getElementById('graph-scroll');
  if(!scroll)return;
  setZoom(Math.max(.8,Math.min(1,(scroll.clientWidth-18)/graphSize.width,(scroll.clientHeight-18)/graphSize.height)));
  scroll.scrollTo(0,0);
};
const closeDrawer = () => {
  selectedTask=null;
  overlay.innerHTML='';
  shell.inert=false;
  document.body.classList.remove('no-scroll');
  const focus=returnFocus?.isConnected?returnFocus:document.getElementById(`root-${expandedRoot}`);
  focus?.focus({preventScroll:true});
};
const openTask = (id) => {
  const task=taskMap().get(id);
  if(!task)return;
  if(!selectedTask)returnFocus=document.activeElement;
  selectedTask=id;
  const map=taskMap();
  const blocked=blockedBy(task);
  const next=activeProject.tasks.filter(candidate=>candidate.dependsOn.includes(id));
  const relation=(relatedId)=>{
    const related=map.get(relatedId);
    return `<button class="relation" data-detail-task="${relatedId}"><i class="dot ${related.status}"></i><span>${escapeHTML(related.title)}</span>${icon('arrow',12)}</button>`;
  };
  overlay.innerHTML=`<div class="drawer-backdrop" id="drawer-backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="drawer-header"><span>任务详情</span><button class="button" id="close-drawer" aria-label="关闭任务详情">${icon('close',15)}</button></div><div class="drawer-body"><p class="drawer-id">${task.id}</p><h2 class="drawer-title" id="detail-title">${escapeHTML(task.title)}</h2><div class="drawer-badges">${statusBadge(task.status)}${task.status==='todo'?blocked.length?'<span class="blocked-badge">被阻塞</span>':'<span class="status" style="background:#eeeeff;color:#6969c4">可开始</span>':''}</div><section class="drawer-section"><h3>描述</h3><p class="description">${escapeHTML(task.description)}</p></section><section class="drawer-section"><h3>前置依赖 · ${task.dependsOn.length}</h3>${task.dependsOn.length?task.dependsOn.map(relation).join(''):'<p class="description">无前置依赖</p>'}</section><section class="drawer-section"><h3>当前未完成的前置 · ${blocked.length}</h3>${blocked.length?blocked.map(relation).join(''):'<p class="description">所有前置已完成</p>'}</section><section class="drawer-section"><h3>直接后续 · ${next.length}</h3>${next.length?next.map(item=>relation(item.id)).join(''):'<p class="description">无后续任务</p>'}</section><section class="drawer-section"><div class="detail-line"><span>创建时间</span><strong>${task.createdAt}</strong></div><div class="detail-line"><span>更新时间</span><strong>${task.updatedAt}</strong></div><div class="detail-line"><span>任务 ID</span><strong>${task.id}</strong></div></section></div><div class="drawer-footer">前置与后续关系来自当前任务图快照</div></section></div>`;
  shell.inert=true;
  document.body.classList.add('no-scroll');
  document.getElementById('close-drawer').focus();
};
const navigate = (projectId) => {
  requestNumber++;
  if(selectedTask)closeDrawer();
  activeProject=projectId?projects.find(project=>project.id===projectId):null;
  previewState='normal';
  document.getElementById('preview-state').value='normal';
  expandedRoot=activeProject?roots()[0]?.id:null;
  const destination=projectId?`#project/${projectId}`:'#projects';
  if(location.hash!==destination)history.pushState(null,'',destination);
  render();
  window.scrollTo(0,0);
};
const refresh = () => {
  const current=++requestNumber;
  previewState='loading';
  render();
  setTimeout(()=>{
    if(current!==requestNumber)return;
    previewState='normal';
    document.getElementById('preview-state').value='normal';
    lastRefresh='03:00:30';
    render();
  },450);
};
document.addEventListener('click',event=>{
  const target=event.target.closest('button');
  if(target?.id==='close-drawer'){closeDrawer();return;}
  if(target?.dataset.detailTask){openTask(target.dataset.detailTask);return;}
  if(target?.dataset.project){navigate(target.dataset.project);return;}
  if(target?.dataset.root){expandedRoot=expandedRoot===target.dataset.root?null:target.dataset.root;render();document.getElementById(`root-${target.dataset.root}`)?.focus({preventScroll:true});return;}
  if(target?.dataset.task){openTask(target.dataset.task);return;}
  if(target?.dataset.zoom){const action=target.dataset.zoom;if(action==='fit')fitGraph();else setZoom(zoom+(action==='in'?.1:-.1));return;}
  if(target?.dataset.action==='projects'||target?.id==='nav-projects'){navigate(null);return;}
  if(target?.dataset.action==='retry'||target?.dataset.action==='refresh'){refresh();return;}
  if(event.target.id==='drawer-backdrop')closeDrawer();
});
document.addEventListener('keydown',event=>{
  if(!selectedTask)return;
  if(event.key==='Escape'){event.preventDefault();closeDrawer();return;}
  if(event.key==='Tab'){
    const focusable=[...overlay.querySelectorAll('button:not([disabled])')];
    const first=focusable[0],last=focusable.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
document.getElementById('preview-state').addEventListener('change',event=>{
  requestNumber++;
  const value=event.target.value;
  if(value==='empty-project'){navigate('docs');event.target.value='empty-project';return;}
  if(value==='empty-list'){navigate(null);previewState=value;event.target.value=value;render();return;}
  previewState=value;
  render();
});
window.addEventListener('hashchange',()=>{
  const match=location.hash.match(/^#project\/(.+)$/);
  navigate(match?.[1]||null);
});
window.addEventListener('resize',fitGraph);
if(!location.hash)history.replaceState(null,'','#projects');
const initialProject=location.hash.match(/^#project\/(.+)$/)?.[1];
navigate(projects.some(project=>project.id===initialProject)?initialProject:null);
</script>
