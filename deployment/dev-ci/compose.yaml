services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: daynight
      POSTGRES_PASSWORD: daynight-dev-ci
      POSTGRES_DB: daynight
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, daynight, -d, daynight]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  gateway:
    image: nginx:1.30.6-alpine3.24
    ports:
      - "127.0.0.1::80"
    volumes:
      - ../localhost/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:80/api/v1/projects?limit=1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  server:
    image: ${DAYNIGHT_DEV_CI_IMAGE:?Use deployment/dev-ci/run.sh}
    build:
      context: ../..
      dockerfile: deployment/localhost/Dockerfile
    network_mode: service:gateway
    environment:
      DAYNIGHT_DATABASE_URL: postgres://daynight:daynight-dev-ci@postgres:5432/daynight?sslmode=disable
      DAYNIGHT_LISTEN_ADDR: 127.0.0.1:8787
      DAYNIGHT_STORAGE_ROOT: /var/lib/daynight/storage
    volumes:
      - attachment-data:/var/lib/daynight/storage
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8787/api/v1/projects?limit=1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s

volumes:
  postgres-data:
  attachment-data:
