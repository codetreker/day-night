name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require a package version increase for code changes
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION_EVENT: ${{ github.event_name }}
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSION_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: pnpm version:check "$VERSION_EVENT" "$VERSION_BASE" "$VERSION_HEAD"
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm acceptance
      - name: Upload acceptance evidence
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-acceptance-${{ matrix.os }}
          path: |
            .tmp/validation-environment.json
            .tmp/e2e-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-validation-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-server:
    name: verify (Go server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
          POSTGRES_PASSWORD: daynight-test
          POSTGRES_DB: daynight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynight -d daynight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/daynight-server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare module-local tool directories
        run: mkdir -p .tmp/go-cache .tmp/go-mod .tmp/go .tmp/bin .tmp/tmp .tmp/config .tmp/cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build, vet, race test, and require overall coverage above 90%
        run: bash scripts/check.sh

  checks:
    if: ${{ always() }}
    needs: [verify, verify-server]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CLI platform and the Go server to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SERVER_RESULT: ${{ needs.verify-server.result }}
        run: test "$VERIFY_RESULT" = success && test "$SERVER_RESULT" = success
