name: gh startup diagnostics

on:
  push:
    branches: [fix/gh-probe-timeout]

permissions:
  contents: read

jobs:
  diagnose:
    name: gh startup (${{ matrix.experiment }}, sample ${{ matrix.sample }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        experiment: [baseline, utc, files]
        sample: [1, 2, 3]
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Record untraced cold collector startup
        id: cold
        shell: pwsh
        run: |
          try {
            ./packages/daynight/scripts/diagnose-gh-startup.ps1 -Experiment '${{ matrix.experiment }}'
          } finally {
            $destination = '.tmp/gh-startup-cold'
            if (Test-Path -LiteralPath '.tmp/gh-startup') {
              Move-Item -LiteralPath '.tmp/gh-startup' -Destination $destination
            } else {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
            }
            foreach ($receipt in @('.tmp/validation-probes.json', '.tmp/validation-environment.json')) {
              if (Test-Path -LiteralPath $receipt) { Move-Item -LiteralPath $receipt -Destination $destination }
            }
          }
      - name: Record traced warm collector startup
        id: warm
        if: ${{ always() && steps.cold.outcome != 'skipped' }}
        shell: pwsh
        run: |
          try {
            ./packages/daynight/scripts/diagnose-gh-startup.ps1 -Experiment '${{ matrix.experiment }}' -TraceInitialization
          } finally {
            $destination = '.tmp/gh-startup-warm'
            if (Test-Path -LiteralPath '.tmp/gh-startup') {
              Move-Item -LiteralPath '.tmp/gh-startup' -Destination $destination
            } else {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
            }
            foreach ($receipt in @('.tmp/validation-probes.json', '.tmp/validation-environment.json')) {
              if (Test-Path -LiteralPath $receipt) { Move-Item -LiteralPath $receipt -Destination $destination }
            }
          }
      - name: Upload native startup diagnostics
        if: ${{ always() && steps.cold.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-startup-${{ matrix.experiment }}-${{ matrix.sample }}
          path: |
            .tmp/gh-startup-cold/
            .tmp/gh-startup-warm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
