name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
  XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.tmp/npm-userconfig

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Require a main-branch dispatch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned npm CLI locally
        run: npm install --prefix .tmp/npm-cli --no-save --package-lock=false --ignore-scripts --no-audit --no-fund npm@12.2.0
      - name: Skip an existing release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CLI_JS: ${{ github.workspace }}/.tmp/npm-cli/node_modules/npm/bin/npm-cli.js
        run: node packages/daynight/scripts/publish.ts preflight "$GITHUB_SHA"

  prepare:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - run: pnpm --filter @codetreker/daynight typecheck
      - run: pnpm --filter @codetreker/daynight test
      - run: pnpm --filter @codetreker/daynight acceptance
      - name: Prepare the source-bound publication artifact
        id: release
        run: |
          node packages/daynight/scripts/publish.ts prepare "$GITHUB_SHA"
          node -p '"version=" + JSON.parse(require("node:fs").readFileSync(".tmp/npm-release/artifact/release.json", "utf8")).version' >> "$GITHUB_OUTPUT"
      - name: Install and check the publication artifact
        run: |
          mkdir -p .tmp/npm-release/consumer
          printf '{"private":true}\n' > .tmp/npm-release/consumer/package.json
          npm install --prefix .tmp/npm-release/consumer --ignore-scripts --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE/.tmp/npm-release/artifact/package.tgz"
          test "$(.tmp/npm-release/consumer/node_modules/.bin/daynight --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/daynight/package.json", "utf8")).version')"
          .tmp/npm-release/consumer/node_modules/.bin/daynight --help
      - name: Retain the validated publication artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publication
          path: .tmp/npm-release/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish daynight v${{ needs.prepare.outputs.version }}
    needs: [preflight, prepare]
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Install the pinned npm CLI locally
        run: npm install --prefix .tmp/npm-cli --no-save --package-lock=false --ignore-scripts --no-audit --no-fund npm@12.2.0
      - name: Recheck before publication
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CLI_JS: ${{ github.workspace }}/.tmp/npm-cli/node_modules/npm/bin/npm-cli.js
        run: node packages/daynight/scripts/publish.ts preflight "$GITHUB_SHA"
      - name: Install the pinned pnpm publication CLI locally
        if: steps.preflight.outputs.skip != 'true'
        run: npm install --prefix .tmp/pnpm-publish --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pnpm@11.28.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.preflight.outputs.skip != 'true'
        with:
          name: npm-publication
          path: .tmp/npm-release/artifact/
      - name: Publish with OIDC, verify npmjs, and create the release tag
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CLI_JS: ${{ github.workspace }}/.tmp/npm-cli/node_modules/npm/bin/npm-cli.js
          PNPM_CLI_JS: ${{ github.workspace }}/.tmp/pnpm-publish/node_modules/pnpm/bin/pnpm.cjs
        run: node packages/daynight/scripts/publish.ts publish "$GITHUB_SHA"
